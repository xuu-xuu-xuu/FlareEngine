name: 发布 Flare Engine 安装包与版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签（如 v0.2.0）'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release-windows-x64:
    name: 构建 Windows x64 安装程序并发布 Release
    runs-on: windows-2022
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 解析版本号
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $version = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 编译 C++20 / DirectX 12 原生目标与安装器（Release）
        shell: pwsh
        run: |
          . .\Scripts\Import-MsvcEnvironment.ps1
          Import-EngineMsvcEnvironment
          cmake --preset windows-x64-release -DFLARE_BUILD_DEVELOPMENT_TOOLS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-x64-release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\Source\FunctionLayer\Scripting\Bootstrap\Bootstrap.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打包编辑器便携目录与一键安装程序（Setup.exe + Portable.zip）
        shell: pwsh
        run: |
          .\Scripts\Build-EditorPackage.ps1 -Configuration Release -Name FlareEngine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Scripts\Build-EditorInstaller.ps1 -Configuration Release -Version "${{ steps.meta.outputs.version }}" -PackageDirectory "out/packages/FlareEngine" -OutputDirectory "out/release" -IncludePortableZip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 生成 Release 发布说明并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          $shaContent = (Get-Content -LiteralPath "out/release/SHA256SUMS.txt" -Raw -Encoding UTF8).Trim()

          $template = @'
          ## Flare Engine __TAG__（Windows x64）

          ### 下载与安装说明

          | 安装包文件 | 适用场景 | 说明 |
          | :--- | :--- | :--- |
          | **`FlareEngine-Setup-v__VER__-x64.exe`** | **推荐大多数用户下载** | 原生向导式安装程序（无需管理员权限与预装 VC++ 运行库），自动配置桌面/开始菜单快捷方式与 Windows「已安装的应用」一键卸载 |
          | **`FlareEngine-Portable-v__VER__-x64.zip`** | 免安装绿色便携版 | 解压至任意无特殊限制目录，双击 `FlareEditor.exe` 即可启动 |
          | **`SHA256SUMS.txt`** | 完整性校验 | 安装程序与便携包的 SHA-256 摘要 |

          > **系统与环境要求**：Windows 10 / 11 x64，支持 DirectX 12 的显卡（硬件光追需支持 DXR 1.1）。安装包已内嵌完整的独立运行环境与预编译示例，开箱即可浏览、布光、编辑自定义 Shader / ASE 连线图并导出游戏；如需新建或修改 C# 脚本并触发热编译，请额外安装 [.NET SDK 10.0](https://dotnet.microsoft.com/download/dotnet/10.0)。

          ### v0.2.0 核心升级与引擎亮点

          - **电影级大气、阴影与镜头后处理升级（v0.2.0 新增）**：新增 4 级级联阴影（支持 PSSM 对数-线性切分 $\lambda$、自适应近裁面 `casterPadding`、双线性 B 样条软阴影与静态阴影缓存）、程序化体积云与外部 `.sky.hlsl` 自定义天空着色器资产槽、三维风场湍流高度体积雾、16x 各向异性过滤与 RGBA8 Mipmap 链、跨显示器 2K/4K 窗口与 `4×SSAA` 超采样，以及原生电影镜头后处理三件套（防剪影红边径向光学色差、`cos^4` 线性暗角、SSAA 自适应 35mm 卤化银胶片颗粒）。
          - **PBR 表面与水体/植被扩展契约（v0.2.0 新增）**：`SurfaceShader` 新增 `Shading Foliage` 双面叶片透射着色模型、材质 `occlusionStrength` 与 `specular` 物理电介质控制、最多 4 路自定义 `2D` 贴图槽（支持 `tex2Dgrad`）及不透明场景深度/颜色采样（`FlareWaterDepth`、`FlareSampleSceneColor`、`FlareTraceScreenReflection`），开箱支持真实浅滩折射、焦散与屏幕空间水面反射。
          - **DirectX 12 现代渲染与可视化着色器**：多散射 PBR、Forward+ 256 局部光、GTAO / SSGI / SSR、SM 6.5 Mesh Shader、带 SVGF 降噪的 DXR 1.1 混合硬件光线追踪，以及 Unity 风格多 Pass `.fshader.hlsl` 与 138 节点 ASE 可视化连线画布（`.fshader.json`）。
          - **自研黑曜金编辑器与 .NET 10 C# 游戏导出**：零第三方 IMGUI 依赖，多窗口停靠与副屏浮动、原生中英文双语、C# 零重启热重载、刚体物理/寻路/骨骼动画/XAudio2 3D 音频、一键独立游戏 `Play.exe` 导出与 4K 60fps 固定步 MP4 视频录制。

          ### 在线文档

          - **使用者文档（快速上手 / C# API 字典 / 自定义 Shader 教程）**：https://xuu-xuu-xuu.github.io/FlareEngine/user/
          - **开发者文档（五层架构 / D3D12 渲染与运行时拆解）**：https://xuu-xuu-xuu.github.io/FlareEngine/

          ### SHA-256 校验值

          ```text
          __SHA256__
          ```
          '@

          $notes = ($template -replace '(?m)^          ', '').Replace('__TAG__', $tag).Replace('__VER__', $ver).Replace('__SHA256__', $shaContent)
          $notesFile = "out/release/RELEASE_NOTES.md"
          [IO.File]::WriteAllText($notesFile, $notes + "`n", [Text.UTF8Encoding]::new($false))

          $assets = @(
            "out/release/FlareEngine-Setup-v$ver-x64.exe",
            "out/release/FlareEngine-Portable-v$ver-x64.zip",
            "out/release/SHA256SUMS.txt"
          )

          $oldEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $oldEap

          if ($exists) {
            gh release edit $tag --title "Flare Engine $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag @assets --title "Flare Engine $tag" --notes-file $notesFile --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
